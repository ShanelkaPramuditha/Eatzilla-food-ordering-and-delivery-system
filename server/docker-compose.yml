version: '3.8'
services:
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: development
    command: pnpm run start:dev api-gateway
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    depends_on:
      - alert-service
      - payment-service
      - order-service
      - restaurant-service
      - delivery-service

  alert-service:
    build:
      context: .
      dockerfile: ./apps/alert/Dockerfile
      target: development
    command: pnpm run start:dev alert
    volumes:
      - .:/usr/src/app
    networks:
      - default
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: ./apps/payment/Dockerfile
      target: development
    command: pnpm run start:dev payment-service
    volumes:
      - .:/usr/src/app
    networks:
      - default
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: ./apps/order/Dockerfile
      target: development
    command: pnpm run start:dev order-service
    volumes:
      - .:/usr/src/app
    networks:
      - default
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  restaurant-service:
    build:
      context: .
      dockerfile: ./apps/restaurant/Dockerfile
      target: development
    command: pnpm run start:dev restaurant
    volumes:
      - .:/usr/src/app
    networks:
      - default
    environment:
      - NODE_ENV=development
    restart: unless-stopped

  delivery-service:
    build:
      context: .
      dockerfile: ./apps/delivery/Dockerfile
      target: development
    command: pnpm run start:dev delivery
    volumes:
      - .:/usr/src/app
    networks:
      - default
    environment:
      - NODE_ENV=development
    restart: unless-stopped

networks:
  default:
    driver: bridge
